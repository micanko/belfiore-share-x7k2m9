<title>ベルフィオーレ 日別ランキング</title>
<style>
/* 昨日つくったランキング（ランキング_営業日報再現版_v2_0818.html）と同じトークン・同じ構成。
   足したのは上部の日付だけ。中身のレイアウトは変えていない。 */
:root{--pink:#C9898E;--pink-d:#B06B72;--bg:#FDF8F6;--ink:#3a2f30;--sub:#8a7a7b;--line:#ecdfdc;--card:#fff;--pinklight:#f6ecee;
  /* ★0820 先方指定：目標の進捗に乗っている＝赤／乗っていない＝青 */
  --up:#C0757B;--up-l:#E0A6AA;--down:#7B9CC4;--down-l:#B3C9E0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"游ゴシック",YuGothic,"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;background:var(--bg);color:var(--ink);padding:0 0 56px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{background:linear-gradient(135deg,#fff 0%,#fbeeec 100%);border-bottom:1px solid var(--line);padding:22px 0 18px;margin-bottom:20px}
h1{font-size:21px;letter-spacing:.07em;font-weight:700;overflow-wrap:anywhere;line-height:1.45}
.sub{color:var(--sub);font-size:12px;margin-top:6px;overflow-wrap:anywhere;line-height:1.7}

/* 断り書き（このページはイメージであることを明示） */
.lede{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--pink);border-radius:0 10px 10px 0;
  padding:13px 16px;margin:0 0 18px;font-size:11.5px;line-height:1.85;color:var(--sub);overflow-wrap:anywhere}
.lede b{color:var(--ink)}

/* 上部に足した日付まわり */
.daybar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:6px}
.daytop{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:inherit;font-size:12.5px;padding:6px 14px;border:0;background:#fff;color:var(--sub);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pink);color:#fff}
.seg button:focus-visible{outline:2px solid var(--pink-d);outline-offset:-2px}
.dayrow{display:flex;align-items:center;gap:12px;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.daylab{font-size:11.5px;color:var(--sub);white-space:nowrap}
.dayval{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:60px}
input[type=range]{flex:1;min-width:0;accent-color:var(--pink);height:22px}
input[type=range]:focus-visible{outline:2px solid var(--pink-d);outline-offset:3px}
.dayhint{font-size:10.5px;color:#b0a2a3;margin:0 0 20px 2px;overflow-wrap:anywhere;line-height:1.7}

.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:30px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--pink)}
.sec-h .jp{overflow-wrap:anywhere}
.sec-h .en{font-size:11px;letter-spacing:.18em;color:var(--pink-d);font-weight:700;text-transform:uppercase}
.sec-h .jp{font-size:16px;font-weight:700}
.sec-h .tail{margin-left:auto;font-size:11px;color:#b0a2a3}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .lb{font-size:11.5px;color:var(--sub);letter-spacing:.04em;overflow-wrap:anywhere}
.kpi .vl{font-size:24px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .sm{font-size:10.5px;color:#b0a2a3;margin-top:3px}
.kpi.hl{background:linear-gradient(135deg,#fff 0%,#fbeeec 100%);border-color:var(--pink)}

table{width:100%;border-collapse:collapse;background:var(--card);font-size:13px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:middle}
th{background:#f6ebe9;font-weight:700;font-size:12px;color:#6b5658;white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.rk{text-align:center;width:38px;color:var(--sub);font-weight:700}
tr.top1 td{background:#fdf3f1}
/* 未入金管理・新ヨミ表と同じ行ホバー */
table tr:hover td{background:var(--pinklight)}
table tr.top1:hover td{background:#fbe4e2}
.barcell{min-width:150px;overflow:hidden}
/* ★0821：赤／青は「目標に届いたか」を示す色。達成率を判定していないバー（売上の大小順）に
   青を使うと全員が未達のように見えるため、既定はローズ系のニュートラルにする。 */
.bar{display:inline-block;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--pink),#E5BFC1);max-width:100%;transition:width .18s ease}
.bar.ok{background:linear-gradient(90deg,var(--up),var(--up-l))}
.bar.ng{background:linear-gradient(90deg,var(--down),var(--down-l))}
.up{color:var(--up);font-weight:700}
.down{color:var(--down);font-weight:700}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.two>div{min-width:0}
/* ★0821：契約率ランキングは5件以上を順位付き、4件以下は順位なしで下段に。
   ※既定値は必ず @media より前（後ろに書くと後勝ちでスマホ指定が消える）。 */
.subhead{font-size:11.5px;color:var(--sub);margin:16px 0 7px;padding-left:9px;border-left:3px solid var(--pinklight);font-weight:500}
.sub-t{font-size:11.5px}
.sub-t th{color:#b0a2a3;font-weight:500}
.sub-t td{color:var(--sub);padding-top:5px;padding-bottom:5px}
.sub-t td.up{color:var(--up)}
.sub-t td.down{color:var(--down)}
.scroll{overflow-x:auto}
.scrollhint{display:none;font-size:10.5px;color:#b0a2a3;margin:-2px 0 6px}
.note{font-size:10.5px;color:#b0a2a3;margin-top:8px;line-height:1.7;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--sub);margin-left:6px}

/* ★0826：表ごとの管轄セレクタ（店舗別・個人別の表のすぐ上に置く）
   ※既定値は必ず @media より前（後ろに書くと後勝ちでスマホ指定が消える） */
.tblsel{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.tblsel label{font-size:11px;color:var(--sub);letter-spacing:.04em}
.tblsel select{font-size:12.5px;padding:5px 9px;max-width:200px}
/* ★0826：全社表示のときに表の中へ入れる管轄の区切り行 */
.grp td{background:#F6EBE9;font-size:11.5px;font-weight:700;color:#7A5F62;
  padding:7px 10px;letter-spacing:.03em;border-top:1px solid var(--line)}
.grp td>i{font-style:normal;display:inline-block}
.grp td span{font-weight:400;color:#A08A8C;margin-left:10px;font-size:10.5px;letter-spacing:0}

/* 管轄別（ダッシュボードA と同じ横棒） */
.mg-rank-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px 14px;max-width:660px}
.mg-rank-list{display:flex;flex-direction:column;gap:2px}
.mgr-row{display:grid;grid-template-columns:86px minmax(0,1fr) 116px;align-items:center;gap:9px;padding:7px 2px}
.mgr-nm{font-size:13px;font-weight:500;color:#4a3f40;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgr-track{height:15px;background:#F1E7E4;border-radius:8px;overflow:hidden}
.mgr-fill{height:100%;border-radius:8px;transition:width .18s ease}
.mgr-val{text-align:right;font-variant-numeric:tabular-nums}
.mgr-val b{font-size:13px;font-weight:500;color:#4a3f40}
.mgr-val span{display:block;font-size:9px;color:#9A8A8C}

@media(max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:560px){
  .wrap{padding:0 12px}
  h1{font-size:17px;letter-spacing:.04em}
  .kpi{padding:11px 12px}.kpi .vl{font-size:21px}.kpis{gap:9px}
  .sec-h{gap:3px 8px;margin:24px 0 10px}
  .sec-h .en{font-size:9.5px;letter-spacing:.14em}
  .sec-h .jp{font-size:14.5px}
  .sec-h .tail{font-size:10px;flex-basis:100%;margin-left:0}
  .mgr-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm val" "bar bar";gap:5px 9px;padding:9px 2px}
  .mgr-nm{grid-area:nm}.mgr-track{grid-area:bar}
  .mgr-val{grid-area:val;white-space:nowrap}
  .mgr-val b{font-size:14px}
  .mgr-val span{display:inline;margin-left:7px;font-size:10px}
  table{font-size:12px}
  th,td{padding:6px 7px;white-space:nowrap}
  .scroll{-webkit-overflow-scrolling:touch}
  .scroll table th:first-child,.scroll table td:first-child{position:sticky;left:0;z-index:2;background:var(--card)}
  .scroll table th:first-child{background:#f6ebe9;z-index:3}
  .scroll table tr.top1 td:first-child{background:#fdf4f3}
  /* ★0826：個人別業績表は氏名の列まで固定する。1列目（区分）だけを固定すると
     横スクロールしたときに誰の行か分からなくなるため（0825 MICA指示）。 */
  .scroll.pin2 table th:first-child,.scroll.pin2 table td:first-child{width:82px;min-width:82px;max-width:82px}
  .scroll.pin2 table th:nth-child(2),.scroll.pin2 table td:nth-child(2){position:sticky;left:82px;z-index:2;background:var(--card)}
  .scroll.pin2 table th:nth-child(2){background:#f6ebe9;z-index:3}
  .scroll.pin2 table tr.top1 td:nth-child(2){background:#fdf4f3}
  /* 管轄の区切り行は colspan で横につながる行なので、列の固定と幅指定から外す */
  .scroll table tr.grp td,.scroll.pin2 table tr.grp td{position:static;width:auto;min-width:0;max-width:none}
  .scroll table tr.grp td>i{position:sticky;left:0}
  .barcell{min-width:96px}
  .scrollhint{display:block}
  .dayrow{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const $=id=>document.getElementById(id);
const DIM={"2026-07":31,"2026-08":31};
const LAST={"2026-07":31,"2026-08":25};      // 8月は進行中。マスタ取得（8/26朝）＝8/26 5時の集計＝8/25までの入力

// 日ごとの内訳はダミー。決定論的に作り、合計がその月の実績と必ず一致するよう正規化する。
function seed(n){let s=n>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function build(total,idx,ym){
  const dim=DIM[ym], last=LAST[ym], rnd=seed(idx*7919+ym.charCodeAt(6)*131);
  const w=[]; let sum=0;
  for(let d=1;d<=last;d++){ const wk=(d%7===6||d%7===0)?1.5:1, tail=d>dim-5?1.5:1;
    const v=(0.5+rnd())*wk*tail; w.push(v); sum+=v; }
  const arr=[]; let run=0;
  for(let d=1;d<=dim;d++){ if(d<=last){ run+=total*w[d-1]/sum; arr.push(run); } else arr.push(null); }
  return arr;
}
const CUM={};
for(const ym in D){
  CUM[ym]={s:{},p:{}};
  D[ym].s.forEach((r,i)=>CUM[ym].s[r[0]]=build(r[3],i,ym));

//   表ごとに独立して選べる（上まで戻らずに切り替えられるよう、それぞれの表のすぐ上に置く）。
//   '' ＝全社。個人別だけは 'OL' ＝オンラインを選べる。
//   管轄は店舗に紐づく属性（マスタ①のMG管轄）で、オンラインスタッフは全店を担当するため

let kanS='', kanP='';

const kanList=()=>{const o=[];D[ym].s.forEach(r=>{if(r[1]&&o.indexOf(r[1])<0)o.push(r[1])});return o;};

const kanLabel=(k,forP)=>k==='無し'?(forP?'兼任・管轄なし':'管轄なし'):k;
function kanSelect(id,cur,withOL){
  const o=['<option value="">全社</option>'];
  // 個人別（withOL=true）は、複数管轄の方が入るので「管轄なし」を必ず選べるようにする
  const list=withOL?[...new Set([...kanList(),'無し'])]:kanList();
  list.forEach(k=>o.push(`<option value="${esc(k)}"${k===cur?' selected':''}>${esc(kanLabel(k,withOL))}</option>`));

  return `<div class="tblsel"><label for="${id}">管轄</label><select id="${id}">${o.join('')}</select></div>`;
}

//   ページの中で並びが食い違わないようにする。
function kanOrder(S){
  const dm={};
  S.forEach(x=>{const k=x.k||'無し'; (dm[k]??={t:0,a:0}); dm[k].t+=x.t; dm[k].a+=x.a;});
  return Object.keys(dm).sort((a,b)=>{
    if(a==='無し') return 1; if(b==='無し') return -1;
    const ra=dm[a].t?dm[a].a/dm[a].t:-Infinity, rb=dm[b].t?dm[b].a/dm[b].t:-Infinity;
    return rb-ra;
  });
}

    <td class="barcell" style="color:var(--sub);font-size:11.5px">入金売上 ${man(x.a)}</td></tr>`));
  A('</table></div></div>');
  A(`<div><div class="sec-h"><span class="en">Store Ranking</span><span class="jp">店舗 入金売上ランキング</span>`+
    `<span class="tail">全${S.length}店</span></div>`);
  A('<div class="scroll"><table><tr><th>#</th><th>店舗</th><th class="n">入金売上</th><th class="barcell">　</th></tr>');
  // ★0821 MICA指定：入金売上ランキングも、その日までの日割り目標に届いているかで赤／青にする。
  //   目標未設定の店（新規OPEN）は判定できないため色を付けない。
  amt.forEach((x,i)=>A(`<tr${i===0?' class="top1"':''}><td class="rk">${i+1}</td><td>${esc(x.n)}</td>
    <td class="n">${man(x.a)}</td>
    <td class="barcell">${bar(mx?x.a/mx:0, x.t?(x.a>=x.t?'ok':'ng'):'')}</td></tr>`));
  A('</table></div></div>');
  A('</div>');

  // 管轄別
  A(`<div class="sec-h"><span class="en">Division</span><span class="jp">管轄別 達成率</span><span class="tail">${esc(label)}</span></div>`);
  const dm={};
  S.forEach(x=>{ if(x.k==='無し'||!x.t)return; (dm[x.k]??={t:0,a:0}); dm[x.k].t+=x.t; dm[x.k].a+=x.a; });
  A('<div class="mg-rank-card"><div class="mg-rank-list">');
  // ★0825 社長指示：60%固定をやめ、その日までの日割り進捗に届いているかで赤／青を決める。
  //   x.t は既に tScale() で日数按分済みなので、r>=1 が「進捗に乗っている」を意味する。
  Object.entries(dm).map(([k,d])=>({k,d,r:d.a/d.t})).sort((a,b)=>b.r-a.r).forEach(({k,d,r})=>{
    const w=Math.min(Math.max(r,0),2)/2*100;
    const g=r>=1?'linear-gradient(90deg,#C0757B,#E0A6AA)':'linear-gradient(90deg,#7B9CC4,#B3C9E0)';
    A(`<div class="mgr-row"><div class="mgr-nm">${esc(k)}</div>
      <div class="mgr-track"><div class="mgr-fill" style="width:${w.toFixed(1)}%;background:${g}"></div></div>
      <div class="mgr-val"><b>${Math.round(r*100)}%</b><span>¥${yen(d.a)} / ¥${yen(d.t)}</span></div></div>`);
  });
  A('</div></div>');

  // 個人ランキング（オンライン／店舗）
  A('<div class="two">');
  // オンラインは人数が少ないので全員。店舗は上位15名まで。
  const TOPN=15;
  [['個人実績ランキング（オンライン）',P.filter(x=>x.ol),0],
   ['個人実績ランキング（店舗）',P.filter(x=>!x.ol),TOPN]].forEach(([title,all,lim])=>{
    const sorted=all.sort((a,b)=>b.a-a.a), rows=lim?sorted.slice(0,lim):sorted;
    const m=rows.length?rows[0].a:1;
    A(`<div><div class="sec-h"><span class="en">Staff Ranking</span><span class="jp">${title}</span>`+
      `<span class="tail">${rows.length<sorted.length?`上位${rows.length}名／全${sorted.length}名`:`全${sorted.length}名`}</span></div>`);
    // ★0825 社長指示：個人目標が入力されたら、その日までの日割り進捗を上回っていれば赤にする。
    //   x.目標 は tScale() で日数按分済み。目標が未入力（0）の人は判定できないので色を付けない
    //   （＝ローズのまま。マスタ⑥に個人目標が入れば、この行が自動で赤／青に切り替わる）。
    const _hasMoku=rows.some(x=>x.目標>0);
    A('<div class="scroll"><table><tr><th>#</th><th>氏名</th><th class="n">入金売上</th>'
      +(_hasMoku?'<th class="n">目標</th><th class="n">達成率</th>':'')+'<th class="barcell">　</th></tr>');
    rows.forEach((x,i)=>{
      const ok=x.目標>0 ? (x.a>=x.目標) : null;                 // null＝目標未入力＝判定しない
      const cls=ok===null?'':(ok?'ok':'ng');
      A(`<tr${i===0?' class="top1"':''}><td class="rk">${i+1}</td><td>${esc(x.n)}</td>
        <td class="n">${man(x.a)}</td>`
        +(_hasMoku?`<td class="n">${x.目標>0?man(x.目標):'—'}</td>
          <td class="n ${ok===null?'':(ok?'up':'down')}">${x.目標>0?pct(x.a,x.目標):'—'}</td>`:'')
        +`<td class="barcell">${bar(m?x.a/m:0, cls)}</td></tr>`);
    });
    A('</table></div></div>');
  });
  A('</div>');

  // 個人実績（脱毛新規契約率）ランキング ★0820 先方指定：オンラインと店舗は合算
  // ★0821 先方回答：母数は新規のお客様の来店。5件以上を順位付き、4件以下は順位なしで下段に。
  const _mg={};
  P.forEach(x=>{ const m=_mg[x.n] || (_mg[x.n]={n:x.n, c:0, k:0, kind:{}});
    m.kind[x.ol?'オンライン':'店舗']=1; });
  Object.keys(RATE_D[ym]||{}).forEach(n=>{ if(n==='合計') return;
    const m=_mg[n]||(_mg[n]={n:n,c:0,k:0,kind:{}});
    m.c=RATE_D[ym][n][0]; m.k=RATE_D[ym][n][1]; });
  const _all=Object.values(_mg).filter(x=>x.c>0).sort((a,b)=>(b.k/b.c)-(a.k/a.c)||(b.c-a.c));
  const rateRows=_all.filter(x=>x.c>=RATE_MIN), fewRows=_all.filter(x=>x.c<RATE_MIN);
  A(`<div class="sec-h"><span class="en">Staff Ranking</span><span class="jp">個人実績ランキング（脱毛新規契約率）</span>`+
    `<span class="tail">オンライン・店舗 合算</span></div>`);
  A('<div class="scroll"><table><tr><th>#</th><th>氏名</th><th>区分</th>'+
    '<th class="n">来店</th><th class="n">契約</th><th class="n">契約率</th><th class="barcell">　</th></tr>');
  rateRows.forEach((x,i)=>{
    const v=x.k/x.c;
    A(`<tr${i===0?' class="top1"':''}><td class="rk">${i+1}</td><td>${esc(x.n)}</td>
      <td>${Object.keys(x.kind).sort().join('・')}</td>
      <td class="n">${x.c}</td><td class="n">${x.k}</td>
      <td class="n ${rateCls(x.k,x.c)}">${rateTxt(x.k,x.c)}</td>
      <td class="barcell">${bar(Math.min(v,1), v>=RATE_LINE?'ok':'ng')}</td></tr>`);
  });
  A('</table></div>');
  if(fewRows.length){
    A(`<div class="subhead">担当${RATE_MIN}件未満の方（${fewRows.length}名・順位なし）</div>`);
    A('<div class="scroll"><table class="sub-t"><tr><th>氏名</th><th>区分</th>'+
      '<th class="n">来店</th><th class="n">契約</th><th class="n">契約率</th></tr>');
    fewRows.forEach(x=>A(`<tr><td>${esc(x.n)}</td><td>${Object.keys(x.kind).sort().join('・')}</td>
      <td class="n">${x.c}</td><td class="n">${x.k}</td>
      <td class="n ${rateCls(x.k,x.c)}">${rateTxt(x.k,x.c)}</td></tr>`));
    A('</table></div>');
  }
  A(`<div class="note">脱毛新規契約率＝契約数÷来店数。新規のお客様のうち契約に至った割合です（既存のお客様の再契約は含みません）。`+
    `担当${RATE_MIN}件以上の${rateRows.length}名を順位付きで、${RATE_MIN}件未満の${fewRows.length}名を下段に表示しています。`+
    `60%以上を赤、60%未満を青で表示。※契約率は月間の確定値で、日付では動きません。</div>`);

  // 店舗別業績表
  const SF=S.filter(x=>!kanS||x.k===kanS);
  A(`<div class="sec-h"><span class="en">Store Table</span><span class="jp">店舗別 業績表</span>`+
    `<span class="tag">${kanS?esc(kanLabel(kanS)):'全社'} ${SF.length}店</span><span class="tail">${esc(label)}</span></div>`);
  A(kanSelect('kanSelS',kanS,false));
  A('<div class="scrollhint">表は横にスクロールできます</div>');
  // ★0825 社長指示：この表は列ごとに基準が違う。
  //   ・入金売上 … その日までの日割り進捗に乗っていれば赤（x.t は按分済みなので x.a>=x.t）
  //   ・達成率   … 月間目標に対して 100% 以上で赤（TABLE_LINE）
  //   目標が未設定の店（新規OPEN）は判定できないため色を付けない。
  A('<div class="scroll"><table><tr><th>店舗</th><th>管轄</th><th class="n">目標</th><th class="n">入金売上</th><th class="n">達成率</th></tr>');
  const storeRow=x=>{
    const rate=x.t?x.a/x.t:null;                                  // 日割り進捗に対する比
    const mRate=x.mt?x.a/x.mt:null;                               // 月間目標に対する達成率
    const kinCls=rate===null?'':(rate>=1?'up':'down');            // 入金売上＝進捗判定
    const rtCls =mRate===null?'':(mRate>=TABLE_LINE?'up':'down'); // 達成率＝100%判定
    A(`<tr><td>${esc(x.n)}</td><td>${esc(x.k==='無し'?'—':x.k)}</td><td class="n">${yen(x.t)}</td>
      <td class="n ${kinCls}">${yen(x.a)}</td>
      <td class="n ${rtCls}">${x.mt?pct(x.a,x.mt):'—'}</td></tr>`);
  };
  const byRate=(a,b)=>(b.t?b.a/b.t:-1)-(a.t?a.a/a.t:-1);
  if(kanS){
    SF.slice().sort(byRate).forEach(storeRow);
  }else{
    // 全社：管轄ごとにまとめ、管轄の中は達成率順
    kanOrder(S).forEach(k=>{
      const g=SF.filter(x=>(x.k||'無し')===k); if(!g.length) return;
      const t=g.reduce((s,x)=>s+x.t,0), a=g.reduce((s,x)=>s+x.a,0);
      A(grpRow(5,kanLabel(k),`${g.length}店　${yenM(a)} / ${yenM(t)}　${t?pct(a,t,0):'—'}`));
      g.sort(byRate).forEach(storeRow);
    });
  }
  A('</table></div>');

  // 個人別 業績表
  const PF=P.map(x=>pInKan(x,kanP)).filter(Boolean);
  // 全社は管轄ごとに分けて並べるため、複数の管轄で実績がある方は複数の行に出る（金額の合計は変わらない）。
  //   タグには実人数と行数の両方を出して、数え違いが起きないようにする。
  const rowN=kanP?PF.length:([...new Set([...kanOrder(S),'無し'])].reduce((s,k)=>s+P.map(x=>pInKan(x,k)).filter(Boolean).length,0)+P.filter(x=>x.ol&&!x.both).length);
  A(`<div class="sec-h"><span class="en">Staff Table</span><span class="jp">個人別 業績表</span>`+
    `<span class="tag">${kanP==='OL'?'オンライン':(kanP?esc(kanLabel(kanP,true)):'全社')} ${PF.length}名`+
    `${(!kanP&&rowN!==PF.length)?`（${rowN}行）`:''}</span>`+
    `<span class="tail">${esc(label)}</span></div>`);
  A(kanSelect('kanSelP',kanP,true));
  A('<div class="scrollhint">表は横にスクロールできます</div>');
  // 目標・達成率の列は、マスタに個人目標が入るまで出さない（今は全員未入力で「—」が並ぶだけのため）。
  A('<div class="scroll pin2"><table><tr><th>区分</th><th>氏名</th><th class="n">店舗数</th><th class="n">入金売上</th><th class="n">契約売上</th>'+
    '<th class="n">脱毛</th><th class="n">エステ</th><th class="n">物販</th><th class="n">契約率</th></tr>');
  const staffRow=x=>{
    const rt=x.rate||bl(x.n);   // 管轄を選んでいるときはその管轄の分だけで率を出す
    A(`<tr><td>${x.both?'兼任':(x.ol?'オンライン':'店舗')}</td><td>${esc(x.n)}</td><td class="n">${x.店舗数}</td>
      <td class="n">${yen(x.a)}</td><td class="n">${yen(x.契約)}</td>
      <td class="n">${yen(x.脱毛)}</td><td class="n">${yen(x.エステ)}</td><td class="n">${yen(x.物販)}</td>
      <td class="n ${rateCls(rt[1],rt[0])}">${rateTxt(rt[1],rt[0])}</td></tr>`);
  };
  const byKin=(a,b)=>b.a-a.a;
  // ★0826：管轄の中では、その管轄のMGご本人を一番上に置く（MICA指示）。以降は入金売上順。
  const byKinMG=k=>(a,b)=>{
    const am=(MG_OF[a.n]===k)?1:0, bm=(MG_OF[b.n]===k)?1:0;
    if(am!==bm) return bm-am;
    return b.a-a.a;
  };
  if(kanP){
    PF.slice().sort(byKinMG(kanP)).forEach(staffRow);
  }else{
    // 全社：店舗スタッフを管轄ごとにまとめ（複数管轄の人はその管轄の分だけ各所に出る）、
    //       オンラインは全店を担当するため最後に全社分をまとめて置く。合計は全社と一致する。
    // 「管轄なし」は複数管轄の方の置き場所なので、管轄なしの店が無くても必ず候補に入れる
    [...new Set([...kanOrder(S),'無し'])].forEach(k=>{
      const g=P.map(x=>pInKan(x,k)).filter(Boolean).sort(byKinMG(k)); if(!g.length) return;
      A(grpRow(9,kanLabel(k,true),`${g.length}名`));
      g.forEach(staffRow);
    });
    const ols=P.filter(x=>x.ol&&!x.both).sort(byKin);   // 兼任は「複数店舗・管轄なし」に入るのでここには出さない
    if(ols.length){
      A(grpRow(9,'オンライン',`${ols.length}名`));
      ols.forEach(staffRow);
    }
  }
  A('</table></div>');

  A('<div class="note">氏名はマスタの表記に統一。改姓により別名で入力されているものは名寄せして1人に合算（古澤　小百合＝堤　小百合／小松　海月＝須藤　海月）。オンラインと店舗を兼任している方は、それぞれの実績を別々に集計しているため両方に出ます。目標が未設定の店は新規OPEN店のため、達成率の対象から外しています。'+
    '<br>個人別業績表は1人1行です。1つの管轄だけで実績がある方はその管轄に、複数の店舗にまたがる方は「兼任・管轄なし」にまとめています（金額はその方の全社分）。オンラインと店舗を兼任されている方は、MGご本人はご自身の管轄に、それ以外は「兼任・管轄なし」に表示します。オンライン専任の方は「オンライン」です。管轄を選んだときは、その管轄の店舗で上げた実績だけを表示し、契約率もその分だけで計算します。'+
    '<br>全社のときは管轄ごとにまとめて並べています（順番は上の「管轄別 達成率」と同じ）。</div>');
  $('body').innerHTML=out.join('\n');
  // innerHTML を差し替えた後なので、ここでイベントを付け直す
  const bindKan=(id,set)=>{const el=$(id); if(el) el.onchange=()=>{set(el.value); render();};};
  bindKan('kanSelS',v=>kanS=v);
  bindKan('kanSelP',v=>kanP=v);
  $('sub').textContent=`出典：日報の集計（ベルフィオーレ_マスタ）／氏名はマスタ表記に統一（改姓は名寄せ）／全${S.length}店`;
}

$('ym').innerHTML=Object.keys(D).sort().reverse()
  .map(k=>`<option value="${k}">${k.slice(0,4)}年${+k.slice(5)}月</option>`).join('');
$('ym').value=ym;
$('ym').onchange=e=>{ ym=e.target.value; day=LAST[ym]; render(); };
$('day').oninput=e=>{ day=+e.target.value; render(); };
$('mCum').onclick=()=>{mode='cum';$('mCum').setAttribute('aria-pressed','true');$('mDay').setAttribute('aria-pressed','false');render()};
$('mDay').onclick=()=>{mode='day';$('mCum').setAttribute('aria-pressed','false');$('mDay').setAttribute('aria-pressed','true');render()};
render();
</script>
